# Local development database. Start with: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kerjainside
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  app:
    build: .
    profiles: [app]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/kerjainside
      MODERATOR_EMAILS: ${MODERATOR_EMAILS:-}
      SECURE_COOKIES: "false"
    ports: ["8787:8787"]
    depends_on: [db]
volumes:
  db:
