<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245c4b"><meta name="description" content="KerjaInside design prototype — Malaysian company reviews"><title>KerjaInside · Design prototype</title><link rel="stylesheet" href="styles.css"></head><body>
<header><a href="#" class="brand" id="brand"><span class="mark">ki</span><span>kerja<em>inside</em><small>MALAYSIA</small></span></a><nav><button data-nav="explore" class="active" data-t="explore"></button><button data-nav="mine" data-t="mine"></button><button data-action="privacy" data-t="privacy"></button></nav><div class="head-right"><span class="prototype-label" data-t="designPreview"></span><select id="language" aria-label="Language / Bahasa / 语言"><option value="en">EN</option><option value="ms">BM</option><option value="zh">中文</option></select><button class="account-button" data-nav="mine" data-t="previewAccount"></button></div></header>
<section id="explore-screen" class="screen"><section class="intro"><div><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="tagline"></h1><p class="subtitle" data-t="subtitle"></p></div><button class="button primary write-top" data-action="write"><span>✎</span><span data-t="write"></span></button></section>
<section class="filters"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" data-placeholder="search"><button class="clear" id="clear" aria-label="Clear">×</button></div><select id="industry" aria-label="Industry"></select><select id="minimum" aria-label="Rating"></select><button class="filter-button" data-action="reset">◎ &nbsp;<span data-t="reset"></span></button></section>
<div class="workspace"><aside class="results" id="results"><div class="results-head"><button id="expand"><strong id="count"></strong> <span class="mobile-only">⌃</span></button><select id="sort" aria-label="Sort results"></select></div><div class="company-list" id="company-list"></div><div class="trust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6Z"/><path d="m8 12 3 3 5-6"/></svg><div><strong data-t="privacyShort"></strong><button data-action="privacy" data-t="privacy"></button></div></div></aside>
<div class="map-wrap"><div id="map" class="map" tabindex="0" role="region" aria-label="Company map"><div id="tiles"></div><div id="pins"></div><div class="map-caption">KLANG VALLEY · MY</div><button class="map-control search-area" data-action="area">⌕ &nbsp;<span data-t="area"></span></button><div id="map-error" class="map-error" hidden data-t="mapFail"></div><div class="map-control zoom"><button data-zoom="1" aria-label="Zoom in">+</button><button data-zoom="-1" aria-label="Zoom out">−</button></div><div class="map-tip" data-t="mapHelp"></div><div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div></div><section class="detail" id="detail" hidden aria-label="Company details"></section></div>
<footer><span class="dot"></span><span data-t="demo"></span><button data-action="privacy" data-t="privacy"></button></footer></section>
<section id="mine-screen" class="screen account" hidden><p class="eyebrow" data-t="designPreview"></p><h1 data-t="mine"></h1><p data-t="accountNote"></p><div id="my-reviews"></div><button class="button primary" data-action="write" data-t="write"></button></section>
<div class="mobile-nav"><button data-nav="explore" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3Z"/><path d="M9 2v17m6-14v17"/></svg><span data-t="explore"></span></button><button class="write-mobile" data-action="write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m13 6 5 5"/></svg><span data-t="write"></span></button><button data-nav="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><span data-t="mine"></span></button></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Close">×</button></div><div id="dialog-body"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
